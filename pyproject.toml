[project]
name = "rikis"
version = "0.0.1"
description = "Lightweight agent that pulls and runs LLM benchmarks from Protorikis Bench"
readme = "README.md"
authors = [
    { name = "protorikis", email = "code@protorikis.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://bench.protorikis.com"

[project.scripts]
rikis = "rikis:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
