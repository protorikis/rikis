[project]
name = "rikis"
version = "0.0.3"
description = "Lightweight agent that pulls and runs LLM benchmarks from Protorikis Bench"
readme = "README.md"
authors = [
    { name = "protorikis", email = "code@protorikis.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://www.protorikis.com"
Source = "https://github.com/protorikis/rikis"

[project.scripts]
rikis = "rikis:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
